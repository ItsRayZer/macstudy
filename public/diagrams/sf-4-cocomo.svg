<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">COCOMO Model Types</text><rect x="20" y="50" width="320" height="55" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="35" y="72" font-size="12" font-weight="700" fill="#39FF14">Organic</text><text x="35" y="90" font-size="10" fill="#A1A1AA">Small team, familiar domain, &lt; 50 KLOC</text><rect x="20" y="115" width="320" height="55" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="35" y="137" font-size="12" font-weight="700" fill="#39FF14">Semi-detached</text><text x="35" y="155" font-size="10" fill="#A1A1AA">Medium team, mixed experience, &lt; 300 KLOC</text><rect x="20" y="180" width="320" height="55" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="35" y="202" font-size="12" font-weight="700" fill="#39FF14">Embedded</text><text x="35" y="220" font-size="10" fill="#A1A1AA">Tight constraints, complex hardware/software</text><text x="180" y="265" text-anchor="middle" font-size="11" fill="#A1A1AA">Effort = a × (KLOC)^b — constants differ per type.</text></svg>
