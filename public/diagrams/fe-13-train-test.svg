<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Train / Test Split</text><rect x="20" y="50" width="320" height="44" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="35" y="77" font-size="11" fill="#A1A1AA">Full dataset (100%)</text><rect x="24" y="110" width="204" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="126" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Train — 80%</text><text x="126" y="147" text-anchor="middle" font-size="10" fill="#A1A1AA">Model learns here</text><rect x="232" y="110" width="104" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="284" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Test — 20%</text><text x="284" y="147" text-anchor="middle" font-size="10" fill="#A1A1AA">Honest evaluation</text><text x="180" y="185" text-anchor="middle" font-size="11" fill="#A1A1AA">Never let the model see test data during training —</text><text x="180" y="203" text-anchor="middle" font-size="11" fill="#A1A1AA">that leaks answers and fakes the score.</text></svg>
