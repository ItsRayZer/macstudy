<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">File Handling Flow</text><rect x="30" y="50" width="90" height="50" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="75" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">open()</text><text x="75" y="88" text-anchor="middle" font-size="10" fill="#A1A1AA">'r' 'w' 'a'</text><rect x="135" y="50" width="90" height="50" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">read/write</text><text x="180" y="88" text-anchor="middle" font-size="10" fill="#A1A1AA">read() write()</text><rect x="240" y="50" width="90" height="50" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="285" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">close()</text><text x="285" y="88" text-anchor="middle" font-size="10" fill="#A1A1AA">free resource</text><line x1="120" y1="75" x2="135" y2="75" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="225" y1="75" x2="240" y2="75" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="30" y="130" width="300" height="60" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5,4"/><text x="180" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Better: with open('f.txt') as f:</text><text x="180" y="171" text-anchor="middle" font-size="10" fill="#A1A1AA">auto-closes, even on error — always prefer this</text><text x="180" y="220" text-anchor="middle" font-size="11" fill="#A1A1AA">Modes: r = read, w = write (overwrite), a = append,</text><text x="180" y="238" text-anchor="middle" font-size="11" fill="#A1A1AA">r+ = read+write. w on missing file creates it.</text></svg>
