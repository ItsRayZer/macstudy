<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Underfit vs Good Fit vs Overfit</text><g><rect x="15" y="45" width="100" height="110" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="65" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Underfit</text><line x1="25" y1="130" x2="105" y2="80" stroke="#39FF14" stroke-width="2"/><circle cx="40" cy="115" r="3" fill="#A1A1AA"/><circle cx="55" cy="105" r="3" fill="#A1A1AA"/><circle cx="70" cy="100" r="3" fill="#A1A1AA"/><circle cx="85" cy="92" r="3" fill="#A1A1AA"/><rect x="130" y="45" width="100" height="110" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#39FF14">Good fit</text><path d="M140,120 Q165,105 180,95 Q195,85 220,75" fill="none" stroke="#39FF14" stroke-width="2"/><circle cx="150" cy="112" r="3" fill="#A1A1AA"/><circle cx="165" cy="104" r="3" fill="#A1A1AA"/><circle cx="180" cy="95" r="3" fill="#A1A1AA"/><circle cx="195" cy="86" r="3" fill="#A1A1AA"/><circle cx="210" cy="78" r="3" fill="#A1A1AA"/><rect x="245" y="45" width="100" height="110" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="295" y="65" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Overfit</text><path d="M255,120 Q265,90 275,110 Q285,130 295,85 Q305,60 315,95 Q325,120 335,90" fill="none" stroke="#FF6B6B" stroke-width="2"/><circle cx="265" cy="108" r="3" fill="#A1A1AA"/><circle cx="280" cy="105" r="3" fill="#A1A1AA"/><circle cx="295" cy="95" r="3" fill="#A1A1AA"/><circle cx="310" cy="92" r="3" fill="#A1A1AA"/><circle cx="325" cy="90" r="3" fill="#A1A1AA"/></g><text x="65" y="175" text-anchor="middle" font-size="10" fill="#A1A1AA">Too simple —</text><text x="65" y="190" text-anchor="middle" font-size="10" fill="#A1A1AA">misses pattern</text><text x="180" y="175" text-anchor="middle" font-size="10" fill="#39FF14">Captures trend,</text><text x="180" y="190" text-anchor="middle" font-size="10" fill="#39FF14">ignores noise</text><text x="295" y="175" text-anchor="middle" font-size="10" fill="#A1A1AA">Memorizes noise —</text><text x="295" y="190" text-anchor="middle" font-size="10" fill="#A1A1AA">fails on new data</text><text x="180" y="225" text-anchor="middle" font-size="11" fill="#A1A1AA">Fix overfit: more data, simpler model, regularization.</text></svg>
