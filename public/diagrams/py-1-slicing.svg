<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker></defs><rect x="30" y="92" width="48" height="48" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="54" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">P</text><text x="54" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">0</text><text x="54" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-6</text><rect x="80" y="92" width="48" height="48" fill="rgba(57,255,20,0.16)" stroke="#39FF14" stroke-width="1.5"/><text x="104" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">y</text><text x="104" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">1</text><text x="104" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-5</text><rect x="130" y="92" width="48" height="48" fill="rgba(57,255,20,0.16)" stroke="#39FF14" stroke-width="1.5"/><text x="154" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">t</text><text x="154" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">2</text><text x="154" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-4</text><rect x="180" y="92" width="48" height="48" fill="rgba(57,255,20,0.16)" stroke="#39FF14" stroke-width="1.5"/><text x="204" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">h</text><text x="204" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">3</text><text x="204" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-3</text><rect x="230" y="92" width="48" height="48" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="254" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">o</text><text x="254" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">4</text><text x="254" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-2</text><rect x="280" y="92" width="48" height="48" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="304" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">n</text><text x="304" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">5</text><text x="304" y="80" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">-1</text><text x="55" y="30" text-anchor="start" font-size="11" font-weight="400" fill="#71717A">negative indices</text><text x="305" y="30" text-anchor="end" font-size="11" font-weight="400" fill="#71717A">positive indices</text><text x="180" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#39FF14">s[1:4] covers y, t, h</text><text x="180" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">end index 4 is excluded, so print(s[1:4]) gives "yth"</text><text x="180" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">print(s * 2) gives "PythonPython"</text></svg>