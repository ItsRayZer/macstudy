<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">List vs Tuple vs Dict</text><rect x="20" y="45" width="100" height="90" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="70" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">list</text><text x="70" y="88" text-anchor="middle" font-size="10" fill="#FFFFFF">[1, 2, 3]</text><text x="70" y="104" text-anchor="middle" font-size="10" fill="#A1A1AA">Mutable</text><text x="70" y="120" text-anchor="middle" font-size="10" fill="#A1A1AA">Ordered</text><rect x="130" y="45" width="100" height="90" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">tuple</text><text x="180" y="88" text-anchor="middle" font-size="10" fill="#FFFFFF">(1, 2, 3)</text><text x="180" y="104" text-anchor="middle" font-size="10" fill="#A1A1AA">Immutable</text><text x="180" y="120" text-anchor="middle" font-size="10" fill="#A1A1AA">Ordered</text><rect x="240" y="45" width="100" height="90" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="290" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">dict</text><text x="290" y="88" text-anchor="middle" font-size="10" fill="#FFFFFF">{'a': 1}</text><text x="290" y="104" text-anchor="middle" font-size="10" fill="#A1A1AA">Mutable</text><text x="290" y="120" text-anchor="middle" font-size="10" fill="#A1A1AA">Key → Value</text><text x="180" y="165" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">When to use which?</text><text x="180" y="188" text-anchor="middle" font-size="11" fill="#A1A1AA">list — collection that changes (marks, items)</text><text x="180" y="206" text-anchor="middle" font-size="11" fill="#A1A1AA">tuple — fixed data (coordinates, RGB)</text><text x="180" y="224" text-anchor="middle" font-size="11" fill="#A1A1AA">dict — lookup by name (student → mark)</text><text x="180" y="258" text-anchor="middle" font-size="11" fill="#A1A1AA">Mutating a tuple raises TypeError.</text></svg>
