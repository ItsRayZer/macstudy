t-size="11" font-weight="400" fill="#71717A">ok 0.95</text><text x="240" y="58" text-anchor="start" font-size="11" font-weight="400" fill="#39FF14">0.6 x 0.02 = 0.012</text><text x="240" y="166" text-anchor="start" font-size="11" font-weight="400" fill="#71717A">0.6 x 0.98 = 0.588</text><text x="240" y="234" text-anchor="start" font-size="11" font-weight="400" fill="#39FF14">0.4 x 0.05 = 0.02</text><text x="240" y="342" text-anchor="start" font-size="11" font-weight="400" fill="#71717A">0.4 x 0.95 = 0.38</text><text x="180" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">P(A | defective) = 0.012 / (0.012 + 0.02) = 0.375</text><text x="180" y="406" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">Leaf products are joint probabilities. Divide by the total defective.</text></svg>