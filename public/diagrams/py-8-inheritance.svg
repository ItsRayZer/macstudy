<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="#39FF14" stroke-width="1.5"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Inheritance in Python</text><rect x="110" y="45" width="140" height="55" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Animal</text><text x="180" y="86" text-anchor="middle" font-size="10" fill="#A1A1AA">+ speak()  + name</text><line x1="120" y1="100" x2="90" y2="140" stroke="#39FF14" stroke-width="1.5" marker-end="url(#arw)"/><line x1="240" y1="100" x2="270" y2="140" stroke="#39FF14" stroke-width="1.5" marker-end="url(#arw)"/><rect x="20" y="140" width="140" height="60" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="90" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Dog</text><text x="90" y="181" text-anchor="middle" font-size="10" fill="#A1A1AA">+ bark() — inherits speak, name</text><rect x="200" y="140" width="140" height="60" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5"/><text x="270" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Cat</text><text x="270" y="181" text-anchor="middle" font-size="10" fill="#A1A1AA">+ meow() — inherits speak, name</text><text x="180" y="230" text-anchor="middle" font-size="11" fill="#A1A1AA">class Dog(Animal): — child reuses parent code,</text><text x="180" y="248" text-anchor="middle" font-size="11" fill="#A1A1AA">can override speak() for its own behavior.</text></svg>
