<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Prototyping Model</text>
  <text x="180" y="50" text-anchor="middle" font-size="12" fill="#A1A1AA">Refine the prototype with user feedback</text>
  <path d="M 180,128 A 105,85 0 1 1 179.9,128" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr2)"/>
  <text x="252" y="168" text-anchor="middle" font-size="10.5" font-style="italic" fill="#A1A1AA">refine &amp; iterate</text>
  <rect x="120" y="103" width="120" height="50" rx="10" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <text x="180" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Requirements</text>
  <text x="180" y="143" text-anchor="middle" font-size="10" fill="#A1A1AA">Gather needs</text>
  <rect x="225" y="188" width="120" height="50" rx="10" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <text x="285" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Quick Design</text>
  <text x="285" y="228" text-anchor="middle" font-size="10" fill="#A1A1AA">Draft the blueprint</text>
  <rect x="120" y="273" width="120" height="50" rx="10" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <text x="180" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Build Prototype</text>
  <text x="180" y="313" text-anchor="middle" font-size="10" fill="#A1A1AA">Working model</text>
  <rect x="15" y="188" width="120" height="50" rx="10" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <text x="75" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">User Evaluation</text>
  <text x="75" y="228" text-anchor="middle" font-size="10" fill="#A1A1AA">Test &amp; give feedback</text>
  <line x1="180" y1="323" x2="180" y2="350" stroke="#39FF14" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="190" y="344" font-size="10.5" fill="#A1A1AA">user approves</text>
  <rect x="70" y="354" width="220" height="54" rx="10" fill="#39FF14"/>
  <text x="180" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#0d0d0f">Final Product</text>
  <text x="180" y="397" text-anchor="middle" font-size="11" fill="#0d0d0f">Released system</text>
  <text x="180" y="444" text-anchor="middle" font-size="11" fill="#A1A1AA">Cheap to change early • Evolves with feedback</text>
