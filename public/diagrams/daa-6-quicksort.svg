<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Quick Sort Partition</text><text x="180" y="44" text-anchor="middle" font-size="10" fill="#A1A1AA">Pivot = last element (4)</text><g><rect x="30" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="48" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">7</text><rect x="70" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="88" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">2</text><rect x="110" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="128" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">9</text><rect x="150" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="168" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">1</text><rect x="190" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="208" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">5</text><rect x="230" y="60" width="36" height="36" rx="6" fill="none" stroke="#39FF14" stroke-width="2"/><text x="248" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">4</text><rect x="270" y="60" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#555"/><text x="288" y="83" text-anchor="middle" font-size="12" fill="#A1A1AA">8</text></g><line x1="180" y1="100" x2="180" y2="125" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><g><rect x="30" y="130" width="36" height="36" rx="6" fill="none" stroke="#39FF14"/><text x="48" y="153" text-anchor="middle" font-size="12" fill="#FFFFFF">2</text><rect x="70" y="130" width="36" height="36" rx="6" fill="none" stroke="#39FF14"/><text x="88" y="153" text-anchor="middle" font-size="12" fill="#FFFFFF">1</text><rect x="110" y="130" width="36" height="36" rx="6" fill="#39FF14"/><text x="128" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text><rect x="150" y="130" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#A1A1AA"/><text x="168" y="153" text-anchor="middle" font-size="12" fill="#A1A1AA">7</text><rect x="190" y="130" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#A1A1AA"/><text x="208" y="153" text-anchor="middle" font-size="12" fill="#A1A1AA">9</text><rect x="230" y="130" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#A1A1AA"/><text x="248" y="153" text-anchor="middle" font-size="12" fill="#A1A1AA">5</text><rect x="270" y="130" width="36" height="36" rx="6" fill="#1C1C1E" stroke="#A1A1AA"/><text x="288" y="153" text-anchor="middle" font-size="12" fill="#A1A1AA">8</text></g><text x="70" y="185" text-anchor="middle" font-size="10" fill="#39FF14">&lt; pivot</text><text x="128" y="185" text-anchor="middle" font-size="10" fill="#39FF14">pivot fixed</text><text x="228" y="185" text-anchor="middle" font-size="10" fill="#A1A1AA">&gt; pivot</text><text x="180" y="215" text-anchor="middle" font-size="11" fill="#A1A1AA">Recurse left and right. Avg O(n log n),</text><text x="180" y="233" text-anchor="middle" font-size="11" fill="#A1A1AA">worst O(n²) when pivot is min/max each time.</text></svg>
