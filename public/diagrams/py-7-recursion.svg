<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker></defs><rect x="30" y="20" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="75" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">f(4)</text><rect x="240" y="20" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="285" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">24</text><line x1="75" y1="64" x2="75" y2="104" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="285" y1="104" x2="285" y2="64" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="120" y1="42" x2="240" y2="42" stroke="#71717A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="180" y="36" text-anchor="middle" font-size="11" font-weight="400" fill="#39FF14">4 x 6 = 24</text><rect x="30" y="104" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="75" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">f(3)</text><rect x="240" y="104" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="285" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">6</text><line x1="75" y1="148" x2="75" y2="188" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="285" y1="188" x2="285" y2="148" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="120" y1="126" x2="240" y2="126" stroke="#71717A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="180" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="#39FF14">3 x 2 = 6</text><rect x="30" y="188" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="75" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">f(2)</text><rect x="240" y="188" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="285" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">2</text><line x1="75" y1="232" x2="75" y2="272" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="285" y1="272" x2="285" y2="232" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="120" y1="210" x2="240" y2="210" stroke="#71717A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="180" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#39FF14">2 x 1 = 2</text><rect x="30" y="272" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="75" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">f(1)</text><rect x="240" y="272" width="90" height="44" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="285" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1</text><line x1="120" y1="294" x2="240" y2="294" stroke="#71717A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="180" y="288" text-anchor="middle" font-size="11" font-weight="400" fill="#39FF14">base case: 1</text><text x="75" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">calls go down</text><text x="285" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">returns unwind up</text><text x="180" y="412" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">f(1) = 1 stops the calls. Then 1, 2, 6, 24 flow back up.</text></svg>