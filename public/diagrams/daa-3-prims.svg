<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker></defs><line x1="70" y1="90" x2="290" y2="90" stroke="#39FF14" stroke-width="3"/><line x1="290" y1="90" x2="180" y2="225" stroke="#39FF14" stroke-width="3"/><line x1="70" y1="90" x2="180" y2="225" stroke="#71717A" stroke-width="2" stroke-dasharray="6,4"/><text x="180" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#39FF14">1</text><text x="248" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#39FF14">2</text><text x="112" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#71717A">3</text><circle cx="70" cy="90" r="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/><text x="70" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">A</text><circle cx="290" cy="90" r="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/><text x="290" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">B</text><circle cx="180" cy="225" r="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/><text x="180" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">C</text><text x="180" y="268" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">1. tree = {A}: cheapest edge out is A-B (1). Pick it.</text><text x="180" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">2. tree = {A, B}: cheapest edge out is B-C (2). Pick it.</text><text x="180" y="312" text-anchor="middle" font-size="11" font-weight="400" fill="#39FF14">A-C (3) would close a cycle, so it is skipped. MST cost = 1 + 2 = 3.</text></svg>