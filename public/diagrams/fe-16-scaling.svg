<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Scaling: Normalization vs Standardization</text><rect x="20" y="50" width="155" height="90" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="97" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">Normalization</text><text x="97" y="94" text-anchor="middle" font-size="11" fill="#FFFFFF">x' = (x − min) / (max − min)</text><text x="97" y="114" text-anchor="middle" font-size="10" fill="#A1A1AA">Range → [0, 1]</text><text x="97" y="130" text-anchor="middle" font-size="10" fill="#A1A1AA">Use: neural nets, KNN</text><rect x="185" y="50" width="155" height="90" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="262" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#39FF14">Standardization</text><text x="262" y="94" text-anchor="middle" font-size="11" fill="#FFFFFF">z = (x − μ) / σ</text><text x="262" y="114" text-anchor="middle" font-size="10" fill="#A1A1AA">Mean 0, std dev 1</text><text x="262" y="130" text-anchor="middle" font-size="10" fill="#A1A1AA">Use: SVM, PCA, regression</text><text x="180" y="175" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">Why scale at all?</text><text x="180" y="198" text-anchor="middle" font-size="11" fill="#A1A1AA">Features on different scales (age 0–100,</text><text x="180" y="216" text-anchor="middle" font-size="11" fill="#A1A1AA">salary 0–10,00,000) let the big one dominate.</text></svg>
