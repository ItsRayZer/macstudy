<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">ACID Properties</text><rect x="20" y="50" width="150" height="80" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="95" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#39FF14">A</text><text x="95" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Atomicity</text><text x="95" y="112" text-anchor="middle" font-size="10" fill="#A1A1AA">All or nothing</text><rect x="190" y="50" width="150" height="80" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="265" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#39FF14">C</text><text x="265" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Consistency</text><text x="265" y="112" text-anchor="middle" font-size="10" fill="#A1A1AA">Valid state to valid state</text><rect x="20" y="145" width="150" height="80" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="95" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#39FF14">I</text><text x="95" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Isolation</text><text x="95" y="207" text-anchor="middle" font-size="10" fill="#A1A1AA">Concurrent txns don't interfere</text><rect x="190" y="145" width="150" height="80" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="265" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#39FF14">D</text><text x="265" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Durability</text><text x="265" y="207" text-anchor="middle" font-size="10" fill="#A1A1AA">Committed = permanent</text><text x="180" y="258" text-anchor="middle" font-size="11" fill="#A1A1AA">Together they guarantee reliable transactions.</text></svg>
