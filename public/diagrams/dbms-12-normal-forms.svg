<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Normal Forms</text><rect x="90" y="45" width="180" height="48" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1NF</text><text x="180" y="82" text-anchor="middle" font-size="10" fill="#A1A1AA">Atomic values, no repeating groups</text><line x1="180" y1="93" x2="180" y2="113" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="90" y="113" width="180" height="48" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2NF</text><text x="180" y="150" text-anchor="middle" font-size="10" fill="#A1A1AA">1NF + no partial dependency</text><line x1="180" y1="161" x2="180" y2="181" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="90" y="181" width="180" height="48" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3NF</text><text x="180" y="218" text-anchor="middle" font-size="10" fill="#A1A1AA">2NF + no transitive dependency</text><line x1="180" y1="229" x2="180" y2="249" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="90" y="249" width="180" height="48" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">BCNF</text><text x="180" y="286" text-anchor="middle" font-size="10" fill="#A1A1AA">Every determinant is a candidate key</text><text x="180" y="322" text-anchor="middle" font-size="11" fill="#A1A1AA">Each level removes a type of anomaly.</text></svg>
