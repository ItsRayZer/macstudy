  <rect x="20" y="362" width="320" height="90" rx="12" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <circle cx="42" cy="392" r="5" fill="#39FF14"/>
  <text x="180" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Responding to change</text>
