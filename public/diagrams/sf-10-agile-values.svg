  <text x="180" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Individuals and interactions</text>
  <text x="180" y="114" text-anchor="middle" font-size="10.5" font-style="italic" fill="#A1A1AA">over</text>
  <text x="180" y="134" text-anchor="middle" font-size="12" fill="#A1A1AA">processes and tools</text>
  <rect x="20" y="162" width="320" height="90" rx="12" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <circle cx="42" cy="192" r="5" fill="#39FF14"/>
  <text x="180" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Working software</text>
  <text x="180" y="214" text-anchor="middle" font-size="10.5" font-style="italic" fill="#A1A1AA">over</text>
  <text x="180" y="234" text-anchor="middle" font-size="12" fill="#A1A1AA">comprehensive documentation</text>
  <rect x="20" y="262" width="320" height="90" rx="12" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
  <circle cx="42" cy="292" r="5" fill="#39FF14"/>
  <text x="180" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Customer collaboration</text>
  <text x="180" y="314" text-anchor="middle" font-size="10.5" font-style="italic" fill="#A1A1AA">over</text>
