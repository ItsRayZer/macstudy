<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 505" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Agile Manifesto</text>
  <text x="180" y="50" text-anchor="middle" font-size="12" fill="#A1A1AA">4 core values</text>
  <rect x="20" y="62" width="320" height="90" rx="12" fill="#0d0d0f" stroke="#39FF14" stroke-width="1.5"/>
