<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Incremental Model</text><rect x="20" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="70" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Increment 1</text><text x="70" y="92" text-anchor="middle" font-size="10" fill="#A1A1AA">Core features</text><rect x="130" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Increment 2</text><text x="180" y="92" text-anchor="middle" font-size="10" fill="#A1A1AA">+ Features</text><rect x="240" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="290" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Increment 3</text><text x="290" y="92" text-anchor="middle" font-size="10" fill="#A1A1AA">+ Features</text><line x1="120" y1="80" x2="130" y2="80" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><line x1="230" y1="80" x2="240" y2="80" stroke="#39FF14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="140" width="320" height="50" rx="10" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5,4"/><text x="180" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Each increment: Design → Code → Test</text><text x="180" y="180" text-anchor="middle" font-size="10" fill="#A1A1AA">Working software after every increment</text><text x="180" y="220" text-anchor="middle" font-size="11" fill="#A1A1AA">✓ Early delivery  ✓ Easier to test  ✓ Lower risk</text><text x="180" y="240" text-anchor="middle" font-size="11" fill="#A1A1AA">✗ Needs clear module boundaries</text><text x="180" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">Build the system piece by piece, each piece fully working.</text></svg>
