<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker></defs><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Feature Selection</text><rect x="20" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="70" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Filter</text><text x="70" y="89" text-anchor="middle" font-size="10" fill="#A1A1AA">Correlation,</text><text x="70" y="103" text-anchor="middle" font-size="10" fill="#A1A1AA">chi-square</text><rect x="130" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="180" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Wrapper</text><text x="180" y="89" text-anchor="middle" font-size="10" fill="#A1A1AA">Try subsets,</text><text x="180" y="103" text-anchor="middle" font-size="10" fill="#A1A1AA">keep best score</text><rect x="240" y="50" width="100" height="60" rx="10" fill="none" stroke="#39FF14" stroke-width="1.5"/><text x="290" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Embedded</text><text x="290" y="89" text-anchor="middle" font-size="10" fill="#A1A1AA">Lasso / tree</text><text x="290" y="103" text-anchor="middle" font-size="10" fill="#A1A1AA">importance</text><text x="180" y="145" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">Why select features?</text><text x="180" y="168" text-anchor="middle" font-size="11" fill="#A1A1AA">✓ Faster training  ✓ Less overfitting</text><text x="180" y="186" text-anchor="middle" font-size="11" fill="#A1A1AA">✓ Simpler model  ✓ Removes noise</text><text x="180" y="220" text-anchor="middle" font-size="11" fill="#A1A1AA">Drop: constant columns, duplicates,</text><text x="180" y="238" text-anchor="middle" font-size="11" fill="#A1A1AA">highly correlated pairs (keep one).</text></svg>
