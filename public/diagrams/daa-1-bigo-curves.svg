<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39FF14"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/></marker></defs><line x1="34" y1="20" x2="34" y2="280" stroke="#3F3F46" stroke-width="1.5"/><line x1="34" y1="280" x2="336" y2="280" stroke="#3F3F46" stroke-width="1.5"/><text x="330" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">n</text><text x="18" y="30" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">time</text><path d="M34,258 H336" fill="none" stroke="#39FF14" stroke-width="2"/><text x="330" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1AA">O(1)</text><path d="M34,258 C120,210 220,196 336,190" fill="none" stroke="#39FF14" stroke-width="2"/><text x="330" y="182" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">O(log n)</text><path d="M34,258 C140,220 240,170 336,110" fill="none" stroke="#39FF14" stroke-width="2"/><text x="330" y="102" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">O(n)</text><path d="M34,258 C140,210 240,140 336,52" fill="none" stroke="#39FF14" stroke-width="2"/><text x="330" y="44" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">O(n log n)</text><path d="M34,258 C120,230 230,150 300,24" fill="none" stroke="#A1A1AA" stroke-width="2"/><text x="306" y="24" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">O(n^2)</text><path d="M34,258 C150,250 240,200 268,24" fill="none" stroke="#A1A1AA" stroke-width="2"/><text x="274" y="24" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">O(2^n)</text><text x="180" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="#71717A">For large n, quadratic and exponential explode. O(n log n) stays tame.</text></svg>